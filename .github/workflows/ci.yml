name: CI (Build and Deploy)

on:
  push:
    branches-ignore:
      - "**-built"
      - "**-built-**"
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Select the job to run'
        required: true
        type: choice
        options:
          - deploy_to_production
      branch:
        description: 'Select the branch to deploy'
        required: true
        type: choice
        options:
          - trunk

jobs:
  build_and_test:
    name: Build and test repo (runs on every push )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the repo
        uses: ./.github/actions/prepare
        with:
          php_version: ${{ env.PHP_VERSION }}

      - name: Replace .gitignore with .deployignore (only trunk branch)
        if: ${{ github.ref == 'refs/heads/trunk' }}
        shell: bash
        run: |
          if [ -f .deployignore ]; then
            mv .deployignore .gitignore
          else
            echo "No .deployignore file found, skipping replacement."
          fi

      - name: commit built trunk branch
        if: ${{ github.ref == 'refs/heads/trunk' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy assets for ${{ inputs.php_version }}"
          git push origin HEAD:$trunk-built --force
          
  deploy_to_production:
    name: Deploy repo (only runs if 'deploy_to_production' is selected in workflow dispatch)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job_to_run == 'deploy_to_production' && github.event.inputs.branch == 'trunk-built' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deploy script
        shell: bash
        run: |
