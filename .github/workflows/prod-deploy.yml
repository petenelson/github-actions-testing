name: Deploy to production (manual trigger)

on:
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Select the job to run'
        required: true
        type: choice
        options:
          - deploy_to_production
      branch:
        description: 'Select the branch to deploy'
        required: true
        type: choice
        options:
          - trunk-built

jobs:
  deploy_to_production:
    name: Deploy trunk to production
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job_to_run == 'deploy_to_production' && github.event.inputs.branch == 'trunk-built' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deploy script
        shell: bash
