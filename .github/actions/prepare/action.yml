name: Prepare repository (Composer, node, tests, build hash)
description: Prepare repository (Composer, node, tests, build hash)

inputs:
  php_version:
    description: PHP version to install
    required: false
    default: '8.4'

runs:
  using: "composite"
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        coverage: none
        tools: composer

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Composer dependencies
      shell: bash
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: npm build 
      working-directory: ${{ inputs.project_path }}
      shell: bash
      run: npm run build

    - name: Write build hash file to build-hash.txt
      shell: bash
      run: |
        BUILD_HASH=$(git rev-parse --short HEAD)
        echo "Build hash: $BUILD_HASH"
        echo "$BUILD_HASH" > build-hash.txt
